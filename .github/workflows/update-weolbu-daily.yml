name: Update Weolbu course archive

on:
  schedule:
    # 매일 00:00 UTC = 09:00 KST
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: update-weolbu-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect public homepage courses
        env:
          SUPABASE_URL: ${{ secrets.WEOLBU_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.WEOLBU_SUPABASE_SERVICE_KEY }}
        run: |
          for attempt in 1 2 3; do
            if node api/weolbu.js; then
              echo "Collection succeeded on attempt $attempt"
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              delay=$((2 ** attempt))
              echo "Collection failed, retrying in ${delay}s (attempt $attempt/3)..."
              sleep $delay
            fi
          done
          echo "Collection failed after 3 attempts"
          exit 1
      
      - name: Report failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
          import('${{ github.workspace }}/.github/lib/collector-utils.mjs').then(({ reportFailure }) => {
            reportFailure({
              workflowName: '월부 강의 데이터 수집',
              runId: '${{ github.run_id }}',
              error: 'Workflow failed - 로그를 확인하세요. Supabase quota 문제일 가능성이 높습니다.',
              repo: '${{ github.repository }}',
              token: process.env.GITHUB_TOKEN
            });
          });
          "
