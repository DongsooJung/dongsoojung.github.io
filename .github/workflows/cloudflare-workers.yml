name: Cloudflare Worker stargate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-stargate
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require Cloudflare deployment secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Verify Cloudflare account token
        shell: bash
        run: |
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | jq --exit-status '.success == true and .result.status == "active"' > /dev/null
          echo 'Cloudflare account token is active.'
      - name: Verify public staging safeguards
        run: node --test tests/cloudflare-static.test.mjs tests/vercel-static.test.mjs tests/cloudflare-analytics.test.mjs tests/cloudflare-analytics-history.test.mjs tests/cloudflare-analytics-frontend.test.mjs
      - name: Stage tracked public site files
        run: node scripts/build-cloudflare-static.mjs
      - name: Test analytics with a local Durable Object
        shell: bash
        run: |
          export ANALYTICS_TEST_IMPORT_KEY=$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")
          npx --yes wrangler@4.151.0 dev --config wrangler.jsonc --ip 127.0.0.1 --port 8787 --persist-to "$RUNNER_TEMP/analytics-test" --var "ANALYTICS_IMPORT_KEY:$ANALYTICS_TEST_IMPORT_KEY" > "$RUNNER_TEMP/analytics-test.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ANALYTICS_TEST_URL=http://127.0.0.1:8787 node --test --test-concurrency=1 tests/cloudflare-analytics-local.test.mjs tests/cloudflare-analytics-history-local.test.mjs
      - name: Deploy stargate to workers.dev
        id: deploy
        shell: bash
        run: |
          npx --yes wrangler@4.151.0 deploy --config wrangler.jsonc | tee "$RUNNER_TEMP/cloudflare-deploy.log"
          url=$(grep -Eo 'https://stargate\.[a-z0-9-]+\.workers\.dev' "$RUNNER_TEMP/cloudflare-deploy.log" | tail -n 1)
          test -n "$url" || { echo '::error::Wrangler did not return a workers.dev URL'; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify deployed static site
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for path in index.html admin/visitors/index.html .well-known/assetlinks.json strategy/monetization-opportunities/index.html; do
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 5 \
              "$WORKER_URL/$path" --output "$RUNNER_TEMP/worker-response"
            cmp ".site-public/$path" "$RUNNER_TEMP/worker-response"
          done
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$WORKER_URL/api/sms.js")
          test "$status" = 404 || { echo '::error::Server source path must return 404'; exit 1; }
          for method in get_site_visit_stats get_site_usage_stats; do
            curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 5 \
              "$WORKER_URL/api/analytics/$method" --header 'Content-Type: application/json' \
              --data '{"p_days":30}' --output "$RUNNER_TEMP/analytics-response.json"
            jq --exit-status '.source == "cloudflare" and (.started_at | type == "string") and (.daily | type == "array")' "$RUNNER_TEMP/analytics-response.json" > /dev/null
          done
          echo "Verified static site: $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"
