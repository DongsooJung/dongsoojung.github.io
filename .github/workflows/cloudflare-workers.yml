name: Cloudflare Worker stargate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-stargate
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require Cloudflare deployment secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Verify Cloudflare account token
        shell: bash
        run: |
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | jq --exit-status '.success == true and .result.status == "active"' > /dev/null
          echo 'Cloudflare account token is active.'
      - name: Verify public staging safeguards
        run: node --test tests/site-alerts.test.mjs tests/site-alert-provision.test.mjs tests/district-geo.test.mjs tests/visitor-regions-private.test.mjs tests/cloudflare-regions.test.mjs tests/visitor-regions-frontend.test.mjs tests/cloudflare-static.test.mjs tests/vercel-static.test.mjs tests/cloudflare-analytics.test.mjs tests/cloudflare-analytics-history.test.mjs tests/cloudflare-analytics-frontend.test.mjs tests/cloudflare-access.test.mjs tests/cloudflare-dashboard-refresh.test.mjs tests/cloudflare-dashboard-frontend.test.mjs tests/cloudflare-service-worker.test.mjs
      - name: Stage tracked public site files
        run: node scripts/build-cloudflare-static.mjs
      - name: Test analytics with a local Durable Object
        shell: bash
        run: |
          export ANALYTICS_TEST_IMPORT_KEY=$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")
          npx --yes wrangler@4.151.0 dev --config wrangler.jsonc --ip 127.0.0.1 --port 8787 --persist-to "$RUNNER_TEMP/analytics-test" --var "ANALYTICS_IMPORT_KEY:$ANALYTICS_TEST_IMPORT_KEY" > "$RUNNER_TEMP/analytics-test.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          ready_deadline=$((SECONDS + 60))
          while (( SECONDS < ready_deadline )); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo '::error::Local analytics Worker exited before becoming ready'
              exit 1
            fi
            if curl --fail --silent --max-time 1 --output /dev/null \
              http://127.0.0.1:8787/api/analytics/get_site_visit_stats \
              --header 'Content-Type: application/json' --data '{}' 2>/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo '::error::Local analytics Worker did not become ready within 60 seconds'
            exit 1
          fi
          ANALYTICS_TEST_URL=http://127.0.0.1:8787 node --test --test-concurrency=1 tests/cloudflare-analytics-local.test.mjs tests/cloudflare-analytics-history-local.test.mjs
      - name: Provision available trade collection secrets
        shell: bash
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
          CUSTOMS_PROXY_BASE: ${{ secrets.CUSTOMS_PROXY_BASE }}
        run: |
          for secret_name in CUSTOMS_API_KEY CUSTOMS_PROXY_BASE; do
            secret_value="${!secret_name}"
            if [ -n "$secret_value" ]; then
              printf '%s' "$secret_value" | npx --yes wrangler@4.151.0 secret put "$secret_name" --config wrangler.jsonc
            fi
          done
      - name: Deploy stargate to workers.dev
        id: deploy
        shell: bash
        run: |
          npx --yes wrangler@4.151.0 deploy --config wrangler.jsonc | tee "$RUNNER_TEMP/cloudflare-deploy.log"
          url=$(grep -Eo 'https://stargate\.[a-z0-9-]+\.workers\.dev' "$RUNNER_TEMP/cloudflare-deploy.log" | tail -n 1)
          test -n "$url" || { echo '::error::Wrangler did not return a workers.dev URL'; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify deployed static site
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for path in index.html visitors/index.html .well-known/assetlinks.json strategy/monetization-opportunities/index.html; do
            matched=false
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --location --max-time 10 \
                --header 'Cache-Control: no-cache' \
                "$WORKER_URL/$path?deployment_verify=$GITHUB_RUN_ID-$GITHUB_SHA-$attempt" \
                --output "$RUNNER_TEMP/worker-response" \
                && cmp --silent ".site-public/$path" "$RUNNER_TEMP/worker-response"; then
                matched=true
                break
              fi
              if [ "$attempt" -lt 6 ]; then sleep 5; fi
            done
            if [ "$matched" != true ]; then
              echo "::error::Deployed asset did not match the current source: $path"
              exit 1
            fi
          done
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$WORKER_URL/api/sms.js")
          test "$status" = 404 || { echo '::error::Server source path must return 404'; exit 1; }
          for method in get_site_visit_summary get_site_usage_summary; do
            curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 5 \
              "$WORKER_URL/api/analytics/$method" --header 'Content-Type: application/json' \
              --data '{"p_days":30}' --output "$RUNNER_TEMP/analytics-response.json"
            jq --exit-status '.source == "cloudflare" and (has("daily") | not) and (has("historical_import") | not)' "$RUNNER_TEMP/analytics-response.json" > /dev/null
          done
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$WORKER_URL/admin/visitors/")
          case "$status" in 302|303|401|403) ;; *) echo '::error::Administrator page must require authentication'; exit 1;; esac
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header 'Content-Type: application/json' --data '{}' "$WORKER_URL/api/admin/analytics/get_site_usage_stats")
          case "$status" in 302|303|401|403) ;; *) echo '::error::Detailed analytics must require authentication'; exit 1;; esac
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header 'Content-Type: application/json' --data '{}' "$WORKER_URL/api/analytics/get_site_usage_stats")
          test "$status" = 404 || { echo '::error::The former public detailed analytics endpoint must be closed'; exit 1; }
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header 'Content-Type: application/json' --data '{"p_days":30}' "$WORKER_URL/api/analytics/get_site_region_stats")
          test "$status" = 404 || { echo '::error::Regional statistics must not be public'; exit 1; }
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header 'Content-Type: application/json' --data '{"p_days":30}' "$WORKER_URL/api/admin/analytics/get_site_region_stats")
          case "$status" in 302|303|401|403) ;; *) echo '::error::Regional statistics require administrator authentication'; exit 1;; esac
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 5 "$WORKER_URL/api/analytics/get_site_region_summary" --header 'Content-Type: application/json' --data '{"p_days":30}' --output "$RUNNER_TEMP/public-regions.json"
          jq --exit-status '.source == "cloudflare" and (.regions | type == "array") and (has("visitor_id") | not) and (has("ip") | not)' "$RUNNER_TEMP/public-regions.json" > /dev/null
          curl --fail --silent --show-error "$WORKER_URL/api/dashboards/status" --output "$RUNNER_TEMP/dashboard-status.json"
          jq --exit-status '.datasets | length == 3' "$RUNNER_TEMP/dashboard-status.json" > /dev/null
          echo "Verified static site: $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"


