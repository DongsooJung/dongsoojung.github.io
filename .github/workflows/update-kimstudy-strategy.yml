name: Update tutoring strategy dashboard

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-kimstudy-strategy
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Load authorized student inquiries in 100-row pages
        env:
          AUTHORIZED_KIMSTUDY_STUDENT_EXPORT_URL: ${{ secrets.AUTHORIZED_KIMSTUDY_STUDENT_EXPORT_URL }}
          AUTHORIZED_STUDENT_EXPORT_TOKEN: ${{ secrets.AUTHORIZED_STUDENT_EXPORT_TOKEN }}
        run: node scripts/update-kimstudy-strategy.mjs
      - name: Commit refreshed strategy data
        run: |
          if git diff --quiet -- strategy/kimstudy-math/data/latest.json; then
            echo "No strategy data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategy/kimstudy-math/data/latest.json
          git commit -m "data: update tutoring strategy dashboard"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$branch" && git push origin "HEAD:$branch"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" = 5 ]; then
              echo "::error::data push failed after 5 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
