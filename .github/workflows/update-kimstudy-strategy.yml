name: Update tutoring strategy dashboard

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-kimstudy-strategy
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Load authorized student inquiries in 100-row pages
        env:
          AUTHORIZED_KIMSTUDY_STUDENT_EXPORT_URL: ${{ secrets.AUTHORIZED_KIMSTUDY_STUDENT_EXPORT_URL }}
          AUTHORIZED_STUDENT_EXPORT_TOKEN: ${{ secrets.AUTHORIZED_STUDENT_EXPORT_TOKEN }}
        run: node scripts/update-kimstudy-strategy.mjs
      - name: Commit refreshed strategy data
        run: |
          if git diff --quiet -- strategy/kimstudy-math/data/latest.json; then
            echo "No strategy data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategy/kimstudy-math/data/latest.json
          git commit -m "data: update tutoring strategy dashboard"
          git push
