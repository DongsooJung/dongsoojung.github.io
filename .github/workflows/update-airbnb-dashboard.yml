name: Update Busan Airbnb dashboard

on:
  push:
    paths:
      - 'airbnb/deploy-marker.txt'
      - 'scripts/update_airbnb_dashboard.py'
  schedule:
    - cron: '30 0 * * *' # 09:30 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh listing status
        run: python scripts/update_airbnb_dashboard.py

      - name: Commit dashboard refresh
        shell: bash
        run: |
          git config user.name "stargate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add airbnb/index.html
          if git diff --cached --quiet; then
            echo "No dashboard changes"
            exit 0
          fi
          git commit -m "Refresh Busan Airbnb dashboard"
          git push
