name: Update Busan Airbnb dashboard

on:
  push:
    paths:
      - 'airbnb/deploy-marker.txt'
      - 'scripts/update_airbnb_dashboard.py'
  schedule:
    - cron: '30 0 * * *' # 09:30 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: busan-airbnb-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync and discover Busan listings
        shell: bash
        run: |
          git pull --rebase origin main
          python scripts/update_airbnb_dashboard.py

      - name: Commit dashboard and candidate feed
        shell: bash
        run: |
          git config user.name "stargate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add airbnb/index.html airbnb/candidates.json
          if git diff --cached --quiet; then
            echo "No dashboard changes"
            exit 0
          fi
          git commit -m "Refresh Busan Airbnb candidate ranking"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race detected; retry ${attempt}/3"
            sleep $((attempt * 3))
          done
          echo "Failed to push after retries"
          exit 1
