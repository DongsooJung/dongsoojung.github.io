name: Patch www OpenDART card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-www-dart-card-20260723.yml'
  workflow_dispatch:

permissions:
  contents: write

# Retriggered after concurrent homepage visitor updates.
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add OpenDART card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          href = 'href="./dart-top100/"'
          if href in s or 'href="/dart-top100/"' in s:
              print('OpenDART card already exists')
              raise SystemExit(0)
          marker = '''      <a class="proj" href="./soomgo-research/">
        <div class="thumb" style="background:linear-gradient(135deg,#134E4A,#0EA5A4)"><span class="emo">📈</span></div>
        <div class="body">
          <div class="ttl">Soomgo 매출액 &amp; 재무 리서치 2025</div>
          <div class="sub">숨고(브레이브모바일) 2022~2025 매출·영업이익 분석 — OpenDART 감사보고서 기반 리포트.</div>
          <div class="row"><span class="tag">Market Research · OpenDART</span><span class="go">열기 →</span></div>
        </div>
      </a>
'''
          card = '''
      <a class="proj" href="./dart-top100/">
        <div class="badge">NEW · OPENDART</div>
        <div class="thumb" style="background:radial-gradient(320px 170px at 20% 25%,rgba(99,214,160,.45),transparent 60%),radial-gradient(280px 150px at 85% 80%,rgba(79,127,255,.35),transparent 60%),linear-gradient(135deg,#0c1730,#12224a)"><span class="emo">📈</span></div>
        <div class="body">
          <div class="ttl">OpenDART 상위 100 기업 실적</div>
          <div class="sub">금융감독원 전자공시 기반 상위 100개 기업의 분기별 매출액·영업이익을 비교하는 대시보드입니다.</div>
          <div class="row"><span class="tag">OpenDART · Revenue · Operating Profit</span><span class="go">열기 →</span></div>
        </div>
      </a>
'''
          if marker not in s:
              raise SystemExit('Soomgo marker not found')
          p.write_text(s.replace(marker, marker + card, 1), encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add OpenDART top 100 card to www portal"
          git pull --rebase origin main
          git push