name: CodeQL

on:
  push:
    branches:
      - main
    # Data snapshots are generated by dedicated workflows. They do not alter
    # application source and still receive the scheduled weekly CodeQL scan.
    paths-ignore:
      - 'class101/data/**'
      - 'consumer-spending/data/**'
      - 'court-auction/data*.json'
      - 'dart-top100/data/**'
      - 'dart-top100/exports/**'
      - 'data/bidpublic/**'
      - 'data/kstartup/**'
      - 'data/scsbid/**'
      - 'exchange-rate/*.json'
      - 'exchange-rate/*fallback.js'
      - 'google-trends/data.json'
      - 'google-trends/fallback-data.js'
      - 'google-trends/history.json'
      - 'inflearn/data/**'
      - 'inflearn/output/**'
      - 'korea-tourism/data.json'
      - 'korea-tourism/fallback-data.js'
      - 'naver-cafe-research/data/**'
      - 'portfolio/data/**'
      - 'reading/data/**'
      - 'research/airport-congestion/data/**'
      - 'research/gimpo-airport-congestion/data/**'
      - 'strategy/expressway-restarea-bid/data/**'
      - 'strategy/job-opportunities/data/**'
      - 'strategy/kimstudy-math/data/**'
      - 'strategy/used-car/data/**'
      - 'trade/data.json'
      - 'trade/fallback-data.js'
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 19 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL / JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
