name: Update tourism data

on:
  schedule:
    # 매월 말 공표되는 한국관광 데이터랩 공식 XLSX 반영
    - cron: '0 3 27 * *'
  workflow_dispatch:
    inputs:
      source_url:
        description: '(선택) 한국관광 데이터랩 공식 XLSX URL. 비우면 메인 공표 게시물에서 자동 탐색'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/triggers/backfill-tourism'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Install workbook parser
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Import official tourism workbook
        env:
          SOURCE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_url || '' }}
        run: |
          if [ -n "$SOURCE_URL" ]; then
            python3 korea-tourism/import_kto_workbook.py "$SOURCE_URL"
          else
            python3 korea-tourism/import_kto_workbook.py
          fi

      - name: Commit updated data
        run: |
          if git diff --quiet korea-tourism/data.json korea-tourism/fallback-data.js; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add korea-tourism/data.json korea-tourism/fallback-data.js
          git commit -m "data(korea-tourism): 한국관광공사 공식 통계 갱신"
          git push
