name: Update Notion blog posts

on:
  schedule:
    # 매일 03:00 KST (18:00 UTC) — blog.stargateedu.co.kr RSS 갱신과 동일 주기
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync posts from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python3 blog/sync_notion_blog.py

      - name: Commit updated posts
        run: |
          if git diff --quiet blog/posts.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/posts.json
          git commit -m "chore(blog): 노션 블로그 포스트 자동 갱신"
          git push
