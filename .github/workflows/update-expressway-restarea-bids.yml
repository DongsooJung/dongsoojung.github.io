name: Update expressway rest-area bid radar

on:
  schedule:
    - cron: '17 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install requests beautifulsoup4
      - name: Collect public opportunities
        run: python scripts/update-expressway-restarea-bids.py
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- strategy/expressway-restarea-bid/data/opportunities.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "stargate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add strategy/expressway-restarea-bid/data/opportunities.json
          git commit -m "data(strategy): refresh expressway rest-area opportunities"
          git push
