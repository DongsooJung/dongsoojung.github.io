name: Update expressway rest-area bid radar

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/update-expressway-restarea-bids.py'
      - '.github/workflows/update-expressway-restarea-bids.yml'
  schedule:
    - cron: '17 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install requests beautifulsoup4
      - name: Collect public opportunities
        run: python scripts/update-expressway-restarea-bids.py
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- strategy/expressway-restarea-bid/data/opportunities.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "stargate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add strategy/expressway-restarea-bid/data/opportunities.json
          git commit -m "data(strategy): refresh expressway rest-area opportunities"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$branch" && git push origin "HEAD:$branch"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" = 5 ]; then
              echo "::error::data push failed after 5 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
