name: Update PPS award data

on:
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * *'

permissions:
  contents: write

concurrency:
  group: update-pps-award-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Collect official PPS award data
        env:
          PPS_SCSBID_API_KEY: ${{ secrets.PPS_SCSBID_API_KEY }}
        run: node scripts/update-scsbid-data.mjs
      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- data/scsbid; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scsbid
          git commit -m "data: refresh PPS award snapshot"
          git push
