name: Update PPS procurement data

on:
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: update-pps-procurement-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Collect official PPS procurement data
        env:
          PPS_SCSBID_API_KEY: ${{ secrets.PPS_SCSBID_API_KEY }}
        run: |
          node scripts/update-bidpublic-data.mjs
          node scripts/update-scsbid-data.mjs
      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- data/bidpublic data/scsbid; then 
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bidpublic data/scsbid
          git commit -m "data: refresh PPS procurement snapshots"
          
          for attempt in 1 2 3 4; do
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            if [ $attempt -lt 4 ]; then
              delay=$((2 ** attempt))
              echo "Push failed, retrying in ${delay}s (attempt $attempt/4)..."
              sleep $delay
              git pull --rebase origin main
            fi
          done
          
          echo "Push failed after 4 attempts"
          exit 1
      
      - name: Report failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
          import('${{ github.workspace }}/.github/lib/collector-utils.mjs').then(({ reportFailure }) => {
            reportFailure({
              workflowName: '조달청 데이터 수집',
              runId: '${{ github.run_id }}',
              error: 'Workflow failed - check logs for details',
              repo: '${{ github.repository }}',
              token: process.env.GITHUB_TOKEN
            });
          });
          "
