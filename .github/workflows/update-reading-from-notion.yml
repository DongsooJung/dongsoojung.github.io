name: Update reading dashboard from Notion

on:
  schedule:
    - cron: '15 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reading-notion-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
      NOTION_BOOKS_DATA_SOURCE_ID: ${{ vars.NOTION_BOOKS_DATA_SOURCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch public books and reading records from Notion
        run: |
          if [ -z "$NOTION_API_KEY" ]; then
            echo "::warning::NOTION_API_KEY secret is not configured; keeping the current snapshot."
            exit 0
          fi
          node scripts/update-reading-from-notion.mjs
      - name: Commit changed dataset
        run: |
          if git diff --quiet -- reading/data/books.json reading/data/notion-reading.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "stargate-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reading/data/books.json reading/data/notion-reading.json
          git commit -m "data: sync public reading library from Notion"
          git push
