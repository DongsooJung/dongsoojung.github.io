name: Update Inflearn daily archive

on:
  schedule:
    # 매일 00:15 UTC = 09:15 KST
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-inflearn-daily
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Excel writer
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Collect public homepage courses
        run: python inflearn/fetch_inflearn.py

      - name: Commit today's archive
        run: |
          if git diff --quiet -- inflearn/data inflearn/output; then
            echo "No archive changes"
            exit 0
          fi
          git config user.name "stargate-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add inflearn/data inflearn/output
          git commit -m "data: archive Inflearn homepage $(date -u +%F)"
          git pull --rebase origin main
          git push
