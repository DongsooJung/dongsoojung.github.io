name: Update trade data

on:
  schedule:
    # 매월 16일 03:00 UTC (12:00 KST) — 관세청이 매월 15일경 전월 자료를 현행화한 직후
    - cron: '0 3 16 * *'
  workflow_dispatch:
    inputs:
      api_key:
        description: '(선택) data.go.kr 인증키(Decoding) — CUSTOMS_API_KEY 시크릿이 없을 때 1회용으로 사용. 공개 저장소에서는 실행 기록에 남으므로 사용 후 키 재발급 권장'
        required: false
        default: ''
      debug:
        description: '(선택) true면 게이트웨이 진단 프로브 실행 (403 원인 분석)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mask one-off key in logs
        run: |
          [ -n "${{ inputs.api_key }}" ] && echo "::add-mask::${{ inputs.api_key }}"
          true

      - name: Diagnose gateway (debug)
        if: ${{ inputs.debug == 'true' }}
        env:
          KEY: ${{ secrets.CUSTOMS_API_KEY || inputs.api_key }}
        run: |
          NT="https://apis.data.go.kr/1220000/nationtrade/getNationtradeList?serviceKey=$KEY&strtYymm=202606&endYymm=202606"
          probe() {
            echo "== $1"
            curl -sS --max-time 30 -A "$3" -o /tmp/body -w "HTTP %{http_code}\n" "$2" || true
            head -c 300 /tmp/body; echo; echo
          }
          probe "nationtrade / custom UA"   "$NT" "stargateedu-dashboard"
          probe "nationtrade / browser UA"  "$NT" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          probe "nationtrade / curl UA"     "$NT" "curl/8.5.0"
          probe "nationtrade / param 없음"  "https://apis.data.go.kr/1220000/nationtrade/getNationtradeList" "Mozilla/5.0"
          probe "nationtrade / http 평문"   "http://apis.data.go.kr/1220000/nationtrade/getNationtradeList?serviceKey=$KEY&strtYymm=202606&endYymm=202606" "Mozilla/5.0"
          probe "타 서비스(관광 B551011) 같은 키" "https://apis.data.go.kr/B551011/EdrcntTourismStatsService/getEdrcntTourismStatsList?serviceKey=$KEY&YM=202605&NAT_CD=112&ED_CD=E" "stargateedu-dashboard"
          probe "관세청 환율(1220000 다른 오퍼레이션)" "https://apis.data.go.kr/1220000/retrieveTrifFxrtInfoQry/retrieveTrifFxrtInfo?serviceKey=$KEY&aplyBgnDt=20260601&weekFxrtTpcd=2" "stargateedu-dashboard"

      - name: Fetch nation trade stats (관세청)
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY || inputs.api_key }}
        run: python3 trade/fetch_data.py

      - name: Commit updated data
        run: |
          FILES="trade/data.json trade/fallback-data.js"
          if git diff --quiet $FILES; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore(trade): 국가별 수출입실적 데이터 자동 갱신"
          git push
