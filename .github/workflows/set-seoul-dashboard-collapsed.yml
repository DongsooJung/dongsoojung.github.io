name: Set Seoul dashboards collapsed by default

on:
  push:
    paths:
      - '.github/workflows/set-seoul-dashboard-collapsed.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update default dashboard state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'id="project-visibility-toggle" type="button" aria-expanded="true"',
              'id="project-visibility-toggle" type="button" aria-expanded="false"',
              1,
          )
          text = text.replace(
              '<span aria-hidden="true">▴</span><span>서울 실시간 도시데이터부터 뒤 대시보드 숨기기</span>',
              '<span aria-hidden="true">▾</span><span>서울 실시간 도시데이터 이후 대시보드 보기</span>',
              1,
          )

          marker = "toggle.addEventListener('click', () => {\n    setExpanded(toggle.getAttribute('aria-expanded') !== 'true');\n  });"
          replacement = "setExpanded(false);\n  toggle.addEventListener('click', () => {\n    setExpanded(toggle.getAttribute('aria-expanded') !== 'true');\n  });"

          first_script_start = text.find("const toggle = document.getElementById('project-visibility-toggle');")
          if first_script_start >= 0:
              marker_pos = text.find(marker, first_script_start)
              if marker_pos >= 0 and 'setExpanded(false);' not in text[first_script_start:marker_pos]:
                  text = text[:marker_pos] + replacement + text[marker_pos + len(marker):]

          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/set-seoul-dashboard-collapsed.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/set-seoul-dashboard-collapsed.yml
          git commit -m "Set Seoul dashboards collapsed by default [skip ci]"
          git push
