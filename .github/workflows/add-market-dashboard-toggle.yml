name: Add collapsed market dashboard toggle

on:
  push:
    paths:
      - '.github/workflows/add-market-dashboard-toggle.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'market-dashboard-toggle'
          if marker not in text:
              text = text.replace(
                  '.project-toggle-row{display:flex;justify-content:flex-end;margin:-4px 0 16px}',
                  '.project-toggle-row{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin:-4px 0 16px}',
                  1,
              )

              button_anchor = '''      </button>
    </div>'''
              button = '''      </button>
      <button class="project-toggle" id="market-dashboard-toggle" type="button" aria-expanded="false" aria-controls="projects-grid">
        <span aria-hidden="true">▾</span><span>크몽·숨고·당근 분석 대시보드 보기</span>
      </button>
    </div>'''
              text = text.replace(button_anchor, button, 1)

              script_anchor = "if ('serviceWorker' in navigator) {"
              script = '''(() => {
  const toggle = document.getElementById('market-dashboard-toggle');
  const grid = document.getElementById('projects-grid');
  if (!toggle || !grid) return;

  const targetTitles = [
    'Kmong 거래액 & 재무 리서치 2025',
    'Soomgo 매출액 & 재무 리서치 2025',
    '당근 최근 3개년 재무분석'
  ];
  const cards = [...grid.querySelectorAll(':scope > .proj')].filter((card) => {
    const title = card.querySelector('.ttl')?.textContent.trim() || '';
    return targetTitles.some((target) => title.includes(target));
  });

  if (!cards.length) {
    toggle.hidden = true;
    return;
  }

  const label = toggle.querySelector('span:last-child');
  const icon = toggle.querySelector('span:first-child');

  function setExpanded(expanded) {
    cards.forEach((card) => card.classList.toggle('is-project-hidden', !expanded));
    toggle.setAttribute('aria-expanded', String(expanded));
    label.textContent = expanded
      ? '크몽·숨고·당근 분석 대시보드 숨기기'
      : '크몽·숨고·당근 분석 대시보드 보기';
    icon.textContent = expanded ? '▴' : '▾';
  }

  setExpanded(false);
  toggle.addEventListener('click', () => {
    setExpanded(toggle.getAttribute('aria-expanded') !== 'true');
  });
})();

'''
              text = text.replace(script_anchor, script + script_anchor, 1)
              path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/add-market-dashboard-toggle.yml
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-market-dashboard-toggle.yml
          git commit -m "Add collapsed market dashboard toggle [skip ci]"
          git push
