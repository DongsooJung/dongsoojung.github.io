name: Patch Execution KPI Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-execution-kpi-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inject KPI sync script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('execution/index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="/execution/kpi-sync.js?v=20260816" defer></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>')
          s = s.replace('KPI 입력값은 이 브라우저에 자동 저장됩니다.', 'KPI는 Supabase 중앙 지표에서 자동 동기화됩니다.')
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'execution/kpi-sync.js' execution/index.html
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- execution/index.html; then
            echo 'Already patched'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add execution/index.html
          git commit -m 'feat: connect execution dashboard to Supabase KPIs'
          git push origin main
