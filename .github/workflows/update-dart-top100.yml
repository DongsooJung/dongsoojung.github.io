name: Update OpenDART top 100

on:
  schedule:
    # 매월 5일 02:20 UTC (11:20 KST). 정정공시를 반영해 월 1회 갱신합니다.
    - cron: '20 2 5 * *'
  workflow_dispatch:
    inputs:
      business_year:
        description: '조회할 사업연도(기본값: 2026)'
        required: false
        default: '2026'

permissions:
  contents: write

concurrency:
  group: update-dart-top100-${{ github.ref }}-${{ inputs.business_year || '2026' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Refresh OpenDART financial data
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY || secrets.DART_API_KEY }}
          DART_BUSINESS_YEAR: ${{ inputs.business_year || '2026' }}
        run: python3 dart-top100/fetch_opendart_top100.py

      - name: Commit updated dashboard data
        env:
          DART_BUSINESS_YEAR: ${{ inputs.business_year || '2026' }}
        run: |
          FILES=("dart-top100/index.html" "dart-top100/data")
          if git diff --quiet -- "${FILES[@]}" && [ -z "$(git ls-files --others --exclude-standard -- dart-top100/data)" ]; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "chore(dart): ${DART_BUSINESS_YEAR:-2026}년 OpenDART 실적 갱신"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$branch" && git push origin "HEAD:$branch"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" = 5 ]; then
              echo "::error::data push failed after 5 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
