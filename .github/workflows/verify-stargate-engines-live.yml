name: Verify Stargate engine demos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'math-grader/**'
      - 'strategy/bidscout/**'
      - 'server/api/bidscout.js'
      - 'server/api/mathgrader.js'
      - 'api/**'
      - '.github/workflows/verify-stargate-engines-live.yml'

permissions:
  contents: read

concurrency:
  group: verify-stargate-engines-live
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for the production pages
        shell: bash
        run: |
          set -euo pipefail
          check_page() {
            local url="$1"
            local marker="$2"
            for attempt in {1..20}; do
              if curl --fail --location --silent --show-error --max-time 20 "$url" | grep --fixed-strings --quiet "$marker"; then
                return 0
              fi
              echo "Waiting for $url ($attempt/20)"
              sleep 15
            done
            return 1
          }
          check_page 'https://stargateedu.co.kr/math-grader/' '서술형 AI 채점'
          check_page 'https://stargateedu.co.kr/strategy/bidscout/' 'BidScout'

      - name: Exercise health and demo APIs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error 'https://stargateedu.co.kr/api/mathgrader?action=healthz' \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s);if(!d.ok||d.mode!=='DEMO')process.exit(1)})"
          curl --fail --silent --show-error 'https://stargateedu.co.kr/api/bidscout?action=healthz' \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s);if(!d.ok||d.mode!=='DEMO')process.exit(1)})"
          curl --fail --silent --show-error \
            -H 'content-type: application/json' \
            --data '{"problem":"x²-5x+6=0","max_score":10,"image":{"name":"answer.png","type":"image/png","size":68}}' \
            'https://stargateedu.co.kr/api/mathgrader?action=grade' \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s);if(!d.ok||!Array.isArray(d.steps))process.exit(1)})"
          curl --fail --silent --show-error \
            -H 'content-type: application/json' \
            --data '{"days_back":1,"dry_run":true}' \
            'https://stargateedu.co.kr/api/bidscout?action=run' \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s);if(!d.ok||!Array.isArray(d.top)||d.top.length<1)process.exit(1)})"
