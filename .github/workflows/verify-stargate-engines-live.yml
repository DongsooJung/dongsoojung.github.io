valid
name: Verify Stargate engine demos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'math-grader/**'
      - 'strategy/bidscout/**'
      - 'server/api/bidscout.js'
      - 'server/api/mathgrader.js'
      - 'api/**'
      - '.github/workflows/verify-stargate-engines-live.yml'

permissions:
  contents: read

concurrency:
  group: verify-stargate-engines-live
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for the deployed demo bundle
        shell: bash
        run: |
          set -euo pipefail
          check_page() {
            local url="$1"
            local marker="$2"
            for attempt in {1..20}; do
              if curl --fail --location --silent --show-error --max-time 20 "$url" | grep --fixed-strings --quiet "$marker"; then
                return 0
              fi
              echo "Waiting for $url ($attempt/20)"
              sleep 15
            done
            return 1
          }
          check_page 'https://stargateedu.co.kr/math-grader/' '서술형 AI 채점'
          check_page 'https://stargateedu.co.kr/strategy/bidscout/' 'BidScout'
          check_page 'https://stargateedu.co.kr/math-grader/runtime-config.js' 'apiMode: "client-demo"'
          check_page 'https://stargateedu.co.kr/strategy/bidscout/runtime-config.js' 'apiMode: "client-demo"'
          check_page 'https://stargateedu.co.kr/math-grader/' 'clientDemoApi'
          check_page 'https://stargateedu.co.kr/strategy/bidscout/' 'clientDemo'
