name: Update Gimpo airport congestion data

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-gimpo-airport-congestion.yml'
      - 'scripts/update-gimpo-airport-congestion.mjs'
  # Keep a fresh hourly snapshot without generating six commits per hour.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gimpo-airport-congestion
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Collect Gimpo Airport congestion data
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: node scripts/update-gimpo-airport-congestion.mjs
      - name: Publish changed snapshot
        run: |
          if git diff --quiet -- research/gimpo-airport-congestion/data/latest.json; then
            echo "No snapshot change"
            exit 0
          fi
          git config user.name "stargate-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/gimpo-airport-congestion/data/latest.json
          git commit -m "data: update Gimpo airport congestion snapshot"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$branch" && git push origin "HEAD:$branch"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" = 5 ]; then
              echo "::error::data push failed after 5 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
