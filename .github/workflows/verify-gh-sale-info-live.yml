name: Verify GH sale-info live

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/api/gh-sale-info.js'
      - 'api/[resource].js'
      - 'api/cron/daily-collect.js'
      - 'gh-sale-info/**'
      - '.github/workflows/verify-gh-sale-info-live.yml'

permissions:
  contents: read

concurrency:
  group: verify-gh-sale-info-live
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for live deployment, collect GH notices, verify Supabase readback
        run: |
          node --input-type=module <<'NODE'
          const endpoint = 'https://stargate-bid-api.vercel.app/api/gh-sale-info';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          let collected = null;
          let last = '';

          for (let attempt = 1; attempt <= 24; attempt += 1) {
            try {
              const response = await fetch(endpoint + '?action=collect', {
                headers: { Accept: 'application/json', 'User-Agent': 'STARGATE-GH-Live-Check/1.0' },
              });
              const text = await response.text();
              last = `HTTP ${response.status} ${text.slice(0, 300)}`;
              if (response.ok) {
                const data = JSON.parse(text);
                if (data.ok && Number(data.saved) > 0) {
                  collected = data;
                  console.log(`collect OK on attempt ${attempt}: saved=${data.saved}, rows=${data.rowCount}`);
                  break;
                }
              }
            } catch (error) {
              last = String(error?.message || error);
            }
            console.log(`attempt ${attempt}: live endpoint not ready: ${last}`);
            await sleep(10_000);
          }

          if (!collected) throw new Error(`GH live collection did not succeed: ${last}`);

          const response = await fetch(endpoint + '?limit=10&logLimit=5', {
            headers: { Accept: 'application/json', 'User-Agent': 'STARGATE-GH-Live-Check/1.0' },
          });
          const data = await response.json();
          if (!response.ok || !data.ok) throw new Error(`GH readback failed: HTTP ${response.status}`);
          if (data.storage !== 'lh_sale_notices') throw new Error(`unexpected storage: ${data.storage}`);
          if (!Array.isArray(data.saved) || data.saved.length === 0) throw new Error('GH Supabase readback returned 0 rows');
          if (!data.saved.every(row => ['rent-house','rent-store','buy-rent'].includes(row.source_type))) {
            throw new Error('GH readback contains an unexpected source type');
          }
          console.log(`readback OK: ${data.saved.length} GH rows; latest=${data.saved[0]?.title || '-'}`);
          NODE
