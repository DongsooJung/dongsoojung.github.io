name: Update airport congestion data

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-airport-congestion
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect Incheon Airport public data
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: node scripts/update-airport-congestion.mjs
      - name: Publish changed snapshot
        run: |
          if git diff --quiet -- research/airport-congestion/data/latest.json; then
            echo "No snapshot change"
            exit 0
          fi
          git config user.name "stargate-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/airport-congestion/data/latest.json
          git commit -m "data: update airport congestion snapshot"
          git push
