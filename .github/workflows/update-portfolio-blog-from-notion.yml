name: Update portfolio blog from Notion

on:
  schedule:
    - cron: '20 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-blog-notion-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
      NOTION_PORTFOLIO_DATABASE_ID: ${{ vars.NOTION_PORTFOLIO_DATABASE_ID }}
      NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch public Notion posts for portfolio blog
        run: |
          if [ -z "$NOTION_API_KEY" ] && [ -z "$NOTION_TOKEN" ]; then
            echo "::warning::NOTION_API_KEY/NOTION_TOKEN secret is not configured; keeping the current snapshot."
            exit 0
          fi
          node scripts/update-portfolio-blog-from-notion.mjs
      - name: Commit changed dataset
        run: |
          if git diff --quiet -- portfolio/data/notion-posts.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "stargate-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add portfolio/data/notion-posts.json
          git commit -m "data: sync portfolio blog posts from Notion"
          git push
