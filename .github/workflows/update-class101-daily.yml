name: Update CLASS101 daily archive

on:
  schedule:
    # 매일 00:30 UTC = 09:30 KST
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-class101-daily
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Collect public recommendation lineup
        run: python class101/fetch_class101.py

      - name: Commit today's archive
        run: |
          if git diff --quiet -- class101/data; then
            echo "No archive changes"
            exit 0
          fi
          git config user.name "stargate-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add class101/data
          archive_date=$(python -c "import json; print(json.load(open('class101/data/latest.json', encoding='utf-8'))['archiveDate'])")
          git commit -m "data: archive CLASS101 recommendations ${archive_date}"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$branch" && git push origin "HEAD:$branch"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" = 5 ]; then
              echo "::error::data push failed after 5 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
