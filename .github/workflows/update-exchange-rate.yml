name: Update exchange rate data

on:
  schedule:
    # 매일 18:20 UTC (다음 날 03:20 KST) — ECB 영업일 기준환율 반영
    - cron: '20 18 * * 1-5'
  workflow_dispatch:
    inputs:
      bok_api_key:
        description: '(선택) 한국은행 ECOS 인증키 — BOK_API_KEY 시크릿이 없을 때 1회용으로 사용. 사용 후 키 재발급 권장'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mask one-off keys in logs
        run: |
          [ -n "${{ inputs.bok_api_key }}" ] && echo "::add-mask::${{ inputs.bok_api_key }}"
          true

      - name: Fetch daily exchange rates (ECB)
        run: python3 exchange-rate/fetch_data.py

      - name: Fetch interest rate & CPI (한국은행 ECOS)
        if: always()
        continue-on-error: true
        env:
          BOK_API_KEY: ${{ secrets.BOK_API_KEY || inputs.bok_api_key }}
        run: python3 exchange-rate/fetch_bok.py

      - name: Fetch annual DRAM, energy & commodity data
        if: always()
        continue-on-error: true
        run: |
          python3 -m pip install --disable-pip-version-check --quiet openpyxl
          python3 exchange-rate/fetch_markets.py

      - name: Fetch Korea-US overnight rate gap (FRED)
        if: always()
        continue-on-error: true
        run: python3 exchange-rate/fetch_rate_gap.py

      - name: Fetch Bitcoin monthly prices (Binance Vision)
        if: always()
        continue-on-error: true
        run: python3 exchange-rate/fetch_bitcoin.py

      - name: Commit updated data
        if: always()
        run: |
          FILES="exchange-rate/data.json exchange-rate/fallback-data.js exchange-rate/bok_data.json exchange-rate/bok-fallback.js exchange-rate/market_data.json exchange-rate/market-fallback.js exchange-rate/rate_gap.json exchange-rate/rate-gap-fallback.js exchange-rate/bitcoin_data.json exchange-rate/bitcoin-fallback.js"
          if git diff --quiet $FILES; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore(exchange-rate): 환율·금리·물가·비트코인·DRAM·유가 데이터 자동 갱신"
          git pull --rebase origin main
          git push
