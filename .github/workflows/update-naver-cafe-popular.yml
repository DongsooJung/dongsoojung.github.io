name: Update Naver Cafe popular articles

on:
  # Popular-article rankings do not need hourly repository pushes.
  # Four batches per day keep the dashboard useful while leaving deployment headroom.
  schedule:
    - cron: "37 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naver-cafe-popular-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Fetch public popular-article data
        run: node naver-cafe-research/fetch_data.mjs

      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- naver-cafe-research/data/latest.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "stargate-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add naver-cafe-research/data/latest.json
          git commit -m "data: update Naver Cafe popular articles"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$branch" && git push origin "HEAD:$branch"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" = 5 ]; then
              echo "::error::data push failed after 5 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
