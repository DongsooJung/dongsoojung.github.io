name: Update Naver Cafe popular articles

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naver-cafe-popular-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch public popular-article data
        run: node naver-cafe-research/fetch_data.mjs

      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- naver-cafe-research/data/latest.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "stargate-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add naver-cafe-research/data/latest.json
          git commit -m "data: update Naver Cafe popular articles"
          git pull --rebase origin main
          git push
