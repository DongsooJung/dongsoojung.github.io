name: Cloudflare production deploy

on:
  push:
    branches: [main]
    # Data-only refreshes are served from repository snapshots or APIs and
    # should not upload a full production build.
    paths-ignore:
      - 'research/airport-congestion/data/latest.json'
      - 'research/gimpo-airport-congestion/data/latest.json'
      - 'naver-cafe-research/data/latest.json'
      - 'strategy/expressway-restarea-bid/data/opportunities.json'
      - 'data/used-car/**'
      - 'research/**/data/latest.json'
  # GITHUB_TOKEN-generated commits do not trigger another workflow. Refresh
  # bundled static assets once per day, not once per data snapshot push.
  schedule:
    - cron: '35 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Guard Supabase production project references
        run: node scripts/check-supabase-project-refs.mjs
      - name: Test API contracts and deployment safeguards
        run: node --test tests/*.test.js tests/*.test.mjs tests/*.test.cjs
      - name: Test Incheon facility deduplication
        run: python3 tests/incheon_aggregate_test.py
      - name: Stage public files
        run: node scripts/build-vercel-static.mjs
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Add Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. The token needs Workers Scripts edit on the Stargate account."
            exit 1
          fi
          npx --yes wrangler@4 deploy
      - name: Record Workers deployment
        run: echo 'Cloudflare Worker stargate uploaded. Confirm the workers.dev hostname before changing stargateedu.co.kr DNS.' >> "$GITHUB_STEP_SUMMARY"
