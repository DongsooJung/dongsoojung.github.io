name: Remove requested homepage buttons

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-homepage-buttons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove the two requested homepage elements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          html, exchange_count = re.subn(
              r'\n\s*<a class="btn ghost" href="#live-data">\s*↻ 최신 환율 데이터\s*</a>',
              '',
              html,
              count=1,
          )
          html, publishing_count = re.subn(
              r'\n\s*<a class="proj" href="\./publishing-market-2025/">.*?</a>\s*',
              '\n\n',
              html,
              count=1,
              flags=re.DOTALL,
          )

          if exchange_count != 1 or publishing_count != 1:
              raise SystemExit(
                  f"Unexpected replacement counts: exchange={exchange_count}, publishing={publishing_count}"
              )

          path.write_text(html, encoding="utf-8")
          PY

      - name: Validate changes
        shell: bash
        run: |
          git diff --check
          ! grep -q 'href="#live-data"' index.html
          ! grep -q 'href="./publishing-market-2025/"' index.html

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove homepage exchange and publishing buttons"
          git push
