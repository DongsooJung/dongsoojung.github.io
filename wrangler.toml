name = "stargate"
main = "worker/index.js"
compatibility_date = "2026-10-15"
workers_dev = true

# Static files stay at the edge. Only API, redirects, and live JSON proxies
# invoke the Worker, which is placed next to Seoul (the old Vercel icn1 region).
[assets]
directory = ".site-public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = [
  "/api/*",
  "/viz-dashboard",
  "/viz-dashboard/*",
  "/research/airport-congestion/data/latest.json",
  "/naver-cafe-research/data/latest.json",
]

[placement]
region = "aws:ap-northeast-2"

[triggers]
crons = ["10 21 * * *"]
