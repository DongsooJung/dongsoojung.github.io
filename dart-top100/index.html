function fmt(v) { // 원 단위 → "300.9조" / "8,532억" / "-1,205억"
  if (v === null || v === undefined) return '–';
  if (v === 0) return '0';
  const abs = Math.abs(v);
  if (abs >= 1e12) {
    const cho = v / 1e12;
    return cho.toLocaleString('ko-KR', {maximumFractionDigits: abs >= 1e13 ? 1 : 2}) + '조';
  }
  return Math.round(v / 1e8).toLocaleString('ko-KR') + '억';
}
function fmtEok(v) { // 테이블용: 억 원 정수
  if (v === null || v === undefined) return '–';
  return Math.round(v / 1e8).toLocaleString('ko-KR');
}
function el(tag, attrs, ...children) {
  const ns = 'http://www.w3.org/2000/svg';
  const svgTags = ['svg','g','rect','line','text','path'];
  const e = svgTags.includes(tag) ? document.createElementNS(ns, tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of children) if (c) e.append(c);
  return e;
}
function niceTicks(min, max, n) {
  const span = max - min || 1;
  const step0 = span / n;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let t = lo; t <= hi + step / 2; t += step) ticks.push(t);
  return ticks;
}

function sumLoadedCompanies(field) {
  const totals = {};
  for (const quarter of Q) {
    const values = DATA.companies
      .map(company => company[field]?.[quarter])
      .filter(value => value !== null && value !== undefined);
    totals[quarter] = values.length ? values.reduce((sum, value) => sum + value, 0) : null;
  }
  return totals;
}

function refreshLoadedTotals() {
  DATA.totals = {
    revenue: sumLoadedCompanies('revenue'),
    operating_profit: sumLoadedCompanies('operating_profit')
  };
}

function currentSeries() {
  if (selected) return { rev: selected.revenue, op: selected.operating_profit, name: selected.corp_name };
  return { rev: DATA.totals.revenue, op: DATA.totals.operating_profit,
           name: `현재 불러온 상위 ${DATA.companies.length}개 기업 합산` };
}

function disclosedQuarters() {
  return DATA.meta.available_quarters || Q.filter(q =>
    DATA.companies.some(c => c.revenue[q] !== null || c.operating_profit[q] !== null)
  );
}

async function refreshYearData(year) {
  const button = document.getElementById('yearRefresh');
  const status = document.getElementById('yearStatus');
  button.disabled = true;
  status.textContent = `${year}년 데이터를 불러오는 중…`;
  try {
    const refresh = Date.now();
    const manifestResponse = await fetch(
      `data/${year}/manifest.json?refresh=${refresh}`,
      {cache: 'no-store'}
    );
    if (!manifestResponse.ok) throw new Error(`HTTP ${manifestResponse.status}`);
    const manifest = await manifestResponse.json();
    if (!manifest.meta || Number(manifest.meta.year) !== year ||
        !Array.isArray(manifest.chunks) || !manifest.chunks.length) {
      throw new Error('매니페스트 형식 오류');
    }
    const firstChunkResponse = await fetch(
      `data/${year}/${manifest.chunks[0]}?refresh=${refresh}`,
      {cache: 'no-store'}
    );
    if (!firstChunkResponse.ok) throw new Error(`HTTP ${firstChunkResponse.status}`);
    const firstChunk = await firstChunkResponse.json();
    if (!Array.isArray(firstChunk.companies)) {
      throw new Error('데이터 형식 오류');
    }
    DATA.meta = manifest.meta;
    DATA.companies = firstChunk.companies;
    refreshLoadedTotals();
    selected = null;
    state.sorted = DATA.companies.slice();
    state.filter = '';
    state.manifest = manifest;
    state.nextChunkIndex = 1;
    state.loadingMore = false;
    const url = new URL(window.location.href);
    url.searchParams.set('year', String(year));
    window.history.replaceState({}, '', url);
    build();
    const loadedAt = DATA.meta.generated_at
      ? new Date(DATA.meta.generated_at).toLocaleString('ko-KR')
      : '갱신 시각 미상';
    document.getElementById('yearStatus').textContent =
      `${year}년 상위 ${DATA.companies.length}개 기업 · ${loadedAt} 기준`;
  } catch (error) {
    status.textContent = `${year}년 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.`;
    button.disabled = false;
  }
}

async function loadMoreCompanies() {
  if (state.loadingMore || state.nextChunkIndex >= state.manifest.chunks.length) return;
  const button = document.getElementById('loadMoreCompanies');
  const status = document.getElementById('loadMoreStatus');
  const chunkName = state.manifest.chunks[state.nextChunkIndex];
  state.loadingMore = true;
  button.disabled = true;
  button.textContent = '불러오는 중…';
  status.textContent = `다음 100개 기업 데이터를 불러오는 중입니다.`;
  let failed = false;
  try {
    const response = await fetch(
      `data/${DATA.meta.year}/${chunkName}?refresh=${Date.now()}`,
      {cache: 'no-store'}
    );
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const chunk = await response.json();
    if (!chunk.meta || Number(chunk.meta.year) !== Number(DATA.meta.year) ||
        !Array.isArray(chunk.companies)) {
      throw new Error('데이터 형식 오류');
    }
    const known = new Set(DATA.companies.map(company => company.corp_code));
    const additions = chunk.companies.filter(company => !known.has(company.corp_code));
    DATA.companies.push(...additions);
    DATA.companies.sort((a, b) => a.rank - b.rank);
    state.sorted = DATA.companies.slice();
    state.nextChunkIndex += 1;
    refreshLoadedTotals();
    syncCompanySelector();
    updateLoadedCompanyControls();
    renderDynamic();
    renderTable(state.filter);
  } catch (error) {
    failed = true;
  } finally {
    state.loadingMore = false;
    updateLoadedCompanyControls();
    if (failed) {
      status.textContent = '추가 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';
    }
  }
}

  selector.textContent = '';
  selector.append(el('option', {
    id: 'allCompaniesOption',
    value: '',
    text: `전체 — 현재 불러온 ${DATA.companies.length}개 합산`
  }));
  for (const company of DATA.companies) {
    selector.append(el('option', {
      value: String(company.rank),
      text: `${company.rank}. ${company.corp_name}`
    }));
  }
  selector.value = selectedRank;
}

function updateLoadedCompanyControls() {
  const loaded = DATA.companies.length;
  const total = totalCompanyCount();
  const pageTitle = document.getElementById('pageTitle');
  const rankTitle = document.getElementById('rankTitle');
  const allOption = document.getElementById('allCompaniesOption');
  const button = document.getElementById('loadMoreCompanies');
  const status = document.getElementById('loadMoreStatus');
  if (pageTitle) pageTitle.textContent =
    `${DATA.meta.year}년 매출액 상위 ${loaded}개 기업 — 분기별 매출액·영업이익`;
  if (rankTitle) rankTitle.textContent = `상위 ${loaded}개 기업 순위 (단위: 억 원)`;
  if (allOption) allOption.textContent = `전체 — 현재 불러온 ${loaded}개 합산`;
  if (!button || !status) return;
  const hasMore = state.nextChunkIndex < state.manifest.chunks.length;
  button.disabled = state.loadingMore || !hasMore;
  button.textContent = state.loadingMore ? '불러오는 중…' :
    (hasMore ? '100개 더 불러오기' : '전체 기업 불러오기 완료');
  status.textContent = hasMore
    ? `현재 ${loaded.toLocaleString('ko-KR')}개 / 전체 ${total.toLocaleString('ko-KR')}개`
    : `전체 ${loaded.toLocaleString('ko-KR')}개 기업을 불러왔습니다.`;
}

function exportExcel() {
  const year = Number(DATA.meta.year);
  const link = document.createElement('a');
  link.href = `exports/opendart-${year}-corporate-financials.xlsx`;
  link.download = `OpenDART_${year}_기업실적.xlsx`;
  document.body.append(link);
  link.click();
  link.remove();
  const status = document.getElementById('yearStatus');
  if (status) status.textContent = `${year}년 Excel 파일 다운로드를 시작했습니다.`;
}

function renderDynamic() {
  const s = currentSeries();
  document.getElementById('chartTitle').textContent = s.name;
  // 스탯 타일
  const revA = Q.reduce((a, q) => a + (s.rev[q] ?? 0), 0);
  const opA = Q.reduce((a, q) => a + (s.op[q] ?? 0), 0);
  const isPartialYear = disclosedQuarters().length < Q.length;
  const tiles = document.getElementById('tiles');
  tiles.textContent = '';
  const items = [
    [isPartialYear ? '공시분기 누적 매출액' : '연간 매출액', fmt(revA) + ' 원'],
    [isPartialYear ? '공시분기 누적 영업이익' : '연간 영업이익', fmt(opA) + ' 원'],
    ['영업이익률', revA ? (opA / revA * 100).toFixed(1) + '%' : '–'],
  ];
  for (const [l, v] of items) {
    const t = el('div', {class: 'tile'});
    t.append(el('div', {class: 'lbl', text: l}), el('div', {class: 'val', text: v}));
    tiles.append(t);
  }
  renderChart();
  // 테이블 선택 표시 갱신
  for (const tr of document.querySelectorAll('tbody tr'))
    tr.classList.toggle('sel', !!selected && tr.dataset.rank === String(selected.rank));
}

function renderChart() {
  const host = document.getElementById('chart');
  const s = currentSeries();
  const W = Math.max(480, host.clientWidth || 800), H = 340;
  const m = {top: 24, right: 12, bottom: 28, left: 56};
  const iw = W - m.left - m.right, ih = H - m.top - m.bottom;

  const vals = Q.flatMap(q => [s.rev[q], s.op[q]]).filter(v => v !== null && v !== undefined);
  const vmax = Math.max(0, ...vals), vmin = Math.min(0, ...vals);
  const ticks = niceTicks(vmin, vmax * 1.08, 5);
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const y = v => m.top + ih - (v - lo) / (hi - lo) * ih;

  const svg = el('svg', {width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img',
                         'aria-label': `${s.name} 분기별 매출액 및 영업이익 막대 차트`});
  // 그리드 + y축 라벨
  for (const t of ticks) {
    svg.append(el('line', {x1: m.left, x2: W - m.right, y1: y(t), y2: y(t),
                           stroke: t === 0 ? 'var(--baseline)' : 'var(--grid)', 'stroke-width': 1}));
    svg.append(el('text', {x: m.left - 8, y: y(t) + 4, 'text-anchor': 'end',
                           'font-size': 11, fill: 'var(--text-muted)', text: fmt(t)}));
  }

  const band = iw / 4, bw = Math.min(24, band * 0.18), gap = 2;
  const tip = document.getElementById('tip');
  const groups = [];

  Q.forEach((q, i) => {
    const cx = m.left + band * i + band / 2;
    const g = el('g', {});
    const bars = [['rev', s.rev[q], 'var(--series-rev)', cx - bw - gap / 2],
                  ['op',  s.op[q],  'var(--series-op)',  cx + gap / 2]];
    for (const [, v, color, x] of bars) {
      if (v === null || v === undefined) continue;
      const y0 = y(0), y1 = y(v);
      const top = Math.min(y0, y1), h = Math.max(1.5, Math.abs(y0 - y1));
      const r = Math.min(4, h / 2);
      // 데이터 쪽 끝만 4px 라운드, 기준선 쪽은 각지게
      const d = v >= 0
        ? `M${x},${y0} L${x},${top + r} Q${x},${top} ${x + r},${top} L${x + bw - r},${top} Q${x + bw},${top} ${x + bw},${top + r} L${x + bw},${y0} Z`
        : `M${x},${y0} L${x},${top + h - r} Q${x},${top + h} ${x + r},${top + h} L${x + bw - r},${top + h} Q${x + bw},${top + h} ${x + bw},${top + h - r} L${x + bw},${y0} Z`;
      g.append(el('path', {d, fill: color}));
      // 캡 직접 라벨
      const ly = v >= 0 ? top - 6 : top + h + 14;
      g.append(el('text', {x: x + bw / 2, y: ly, 'text-anchor': 'middle', 'font-size': 11,
                           fill: 'var(--text-secondary)', text: fmt(v)}));
    }
    // x축 라벨
    svg.append(el('text', {x: cx, y: H - 8, 'text-anchor': 'middle', 'font-size': 12,
                           fill: 'var(--text-secondary)', text: QL[q]}));
    // 히트 영역(분기 전체) + 툴팁
    const hit = el('rect', {x: m.left + band * i, y: m.top, width: band, height: ih,
                            fill: 'transparent', tabindex: 0, role: 'presentation'});
    const show = (px, py) => {
      tip.textContent = '';
      tip.append(el('div', {class: 'tq', text: `${s.name} · ${QL[q]}`}));
      for (const [name, v, cssv] of [['매출액', s.rev[q], 'var(--series-rev)'], ['영업이익', s.op[q], 'var(--series-op)']]) {
        const row = el('div', {class: 'row'});
        row.append(el('span', {class: 'k', style: `background:${cssv}`}),
                   el('span', {class: 'v', text: fmt(v) + ' 원'}),
                   el('span', {class: 'n', text: name}));
        tip.append(row);
      }
      const rv = s.rev[q], ov = s.op[q];
      if (rv) tip.append(el('div', {class: 'tq', text: `영업이익률 ${(ov / rv * 100).toFixed(1)}%`}));
      tip.style.display = 'block';
      const card = host.closest('.card').getBoundingClientRect();
      let tx = px - card.left + 14, ty = py - card.top + 14;
      tip.style.left = Math.min(tx, card.width - tip.offsetWidth - 8) + 'px';
      tip.style.top = ty + 'px';
      g.setAttribute('opacity', '0.85');
    };
    const hide = () => { tip.style.display = 'none'; g.removeAttribute('opacity'); };
    hit.addEventListener('pointermove', e => show(e.clientX, e.clientY));
    hit.addEventListener('pointerleave', hide);
    hit.addEventListener('focus', () => {
      const r = hit.getBoundingClientRect();
      show(r.left + r.width / 2, r.top + 40);
    });
    hit.addEventListener('blur', hide);
    groups.push([g, hit]);
  });
  for (const [g] of groups) svg.append(g);
  for (const [, hit] of groups) svg.append(hit);

  host.textContent = '';
  host.append(svg);
}

function renderTable(filter) {
  state.filter = filter || '';
  const wrap = document.getElementById('tablewrap');
  wrap.textContent = '';
  const table = el('table', {});
  const thead = el('thead', {});
  const hr = el('tr', {});
  const aggregateLabel = disclosedQuarters().length < Q.length ? '공시분기 누적' : '연간';
  const cols = ['순위', '기업명',
    '매출 1분기', '매출 2분기', '매출 3분기', '매출 4분기', `매출 ${aggregateLabel}`,
    '영업이익 1분기', '영업이익 2분기', '영업이익 3분기', '영업이익 4분기',
    `영업이익 ${aggregateLabel}`];
  for (const c of cols) hr.append(el('th', {text: c, scope: 'col'}));
  thead.append(hr);
  const tbody = el('tbody', {});
  const f = (filter || '').toLowerCase();
  for (const c of state.sorted) {
    if (f && !c.corp_name.toLowerCase().includes(f)) continue;
    const tr = el('tr', {'data-rank': String(c.rank)});
    const cells = [String(c.rank), c.corp_name,
      ...Q.map(q => fmtEok(c.revenue[q])), fmtEok(c.revenue_annual),
      ...Q.map(q => fmtEok(c.operating_profit[q])), fmtEok(c.operating_profit_annual)];
    cells.forEach((v, i) => {
      const td = el('td', {text: v});
      if (i >= 7 && v.startsWith('-')) td.classList.add('neg');
      tr.append(td);
    });
    if (selected && selected.rank === c.rank) tr.classList.add('sel');
    tr.addEventListener('click', () => {
      selected = c;
      document.getElementById('corpSel').value = String(c.rank);
      renderDynamic();
      document.querySelector('.card').scrollIntoView({behavior: 'smooth'});
    });
    tbody.append(tr);
  }
  table.append(thead, tbody);
  wrap.append(table);
}

build();
const requestedYear = Number(new URLSearchParams(window.location.search).get('year'));
if (AVAILABLE_YEARS.includes(requestedYear) && requestedYear !== DATA.meta.year)
  refreshYearData(requestedYear);

</script>
