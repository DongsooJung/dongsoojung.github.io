<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>방문자 관리자 대시보드 | STARGATE</title>
<style>
:root{--bg:#0a0d14;--panel:#0f172a;--panel2:#111c33;--line:#263452;--ink:#e6edf3;--sub:#9aa7b8;--muted:#6b7a90;--acc:#7aa2ff;--good:#63d6a0;--warm:#ffb86b}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:"Pretendard","Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif;color:var(--ink);background:radial-gradient(900px 520px at 10% -10%,rgba(79,127,255,.18),transparent 60%),var(--bg);min-height:100vh;line-height:1.55}
a{color:inherit;text-decoration:none}.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.brand{font-weight:800}.back{padding:9px 13px;border:1px solid var(--line);border-radius:999px;color:var(--sub);font-size:13px;background:var(--panel)}.hero{margin-top:42px}.kicker{color:var(--good);font-size:12px;font-weight:800;letter-spacing:1.2px}.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.12;margin:8px 0 10px}.hero p{color:var(--sub);margin:0}.status{display:inline-flex;align-items:center;gap:8px;margin-top:14px;color:var(--sub);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--warm)}.status.ok .dot{background:var(--good);box-shadow:0 0 0 5px rgba(99,214,160,.1)}.status.warn .dot{background:var(--warm)}.status.error .dot{background:#ff6b7a}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,var(--panel2),var(--panel));padding:22px;box-shadow:0 18px 44px rgba(0,0,0,.22)}.label{color:var(--sub);font-size:12px;font-weight:700}.value{font-size:34px;font-weight:850;margin-top:8px;letter-spacing:-1px;font-variant-numeric:tabular-nums}.hint{color:var(--muted);font-size:11px;margin-top:5px}.section{margin-top:28px}.section h2{font-size:19px;margin:0 0 12px}.chart{display:flex;align-items:flex-end;gap:6px;height:250px;padding:22px 16px 10px;border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow-x:auto}.bar-wrap{min-width:22px;flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px}.bar{width:100%;min-height:2px;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,var(--acc),#4f7fff);position:relative}.bar:hover::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);white-space:nowrap;background:#05070c;border:1px solid var(--line);padding:5px 7px;border-radius:7px;font-size:11px;color:var(--ink);z-index:5}.day{font-size:9px;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);height:34px}.table{margin-top:14px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}.row{display:grid;grid-template-columns:1fr 120px;padding:12px 16px;border-bottom:1px solid rgba(38,52,82,.65);font-size:13px}.row:last-child{border-bottom:0}.row span:last-child{text-align:right;font-weight:750}.footer{margin-top:24px;color:var(--muted);font-size:11px}.refresh{border:0;border-radius:12px;padding:11px 15px;background:linear-gradient(135deg,#4f7fff,#7aa2ff);color:#081020;font-weight:800;cursor:pointer}.refresh:disabled{opacity:.55}@media(max-width:720px){.metrics{grid-template-columns:1fr}.chart{height:220px}.row{grid-template-columns:1fr 90px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">STARGATE · ADMIN</div><div style="display:flex;gap:8px"><button class="refresh" id="refresh">새로고침</button><a class="back" href="/">← 메인으로</a></div></div>
  <section class="hero"><div class="kicker">VISITOR ANALYTICS</div><h1>방문자 관리자 대시보드</h1><p>한국시간 기준 오늘·누적 방문자를 확인합니다.</p><div class="status" id="status"><span class="dot"></span><span>데이터를 불러오는 중입니다.</span></div></section>
  <section class="metrics"><article class="card"><div class="label">TODAY · 오늘</div><div class="value" id="today">—</div><div class="hint" id="today-date">한국시간 기준</div></article><article class="card"><div class="label">TOTAL · 누적</div><div class="value" id="total">—</div><div class="hint">고유 브라우저·일 단위 누적</div></article><article class="card"><div class="label">30 DAYS · 최근 30일</div><div class="value" id="monthly">—</div><div class="hint">일별 방문 합계</div></article></section>
  <section class="section"><h2>최근 30일 방문 추이</h2><div class="chart" id="chart"></div><div class="table" id="table"></div></section>
  <div class="footer">Supabase 기반으로 집계합니다. 동일 브라우저는 하루 1회만 기록됩니다.</div>
</div>
<script>
(() => {
  const supabaseUrl='https://inftexpcnfinglwlrvsj.supabase.co';
  const anonKey='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXAiLCJyZWYiOiJpbmZ0ZXhwY25maW5nbHdscnZzaiIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzcyOTEzMjM4LCJleHAiOjIwODg0ODkyMzh9.HONuULp0L3B5T0gTiwJMnowjJonJzzNHhUV_LtpDQoI';
  const snapshotKey='stargate-visitor-supabase-snapshot-v1';
  const $=id=>document.getElementById(id);
  const status=$('status'), refresh=$('refresh');
  function day(offset=0){const d=new Date(Date.now()+offset*86400000);const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);const v=Object.fromEntries(p.map(x=>[x.type,x.value]));return `${v.year}-${v.month}-${v.day}`}
  function fmt(n){return (Number(n)||0).toLocaleString('ko-KR')}
  function setStatus(text,state=''){status.className='status'+(state?' '+state:'');status.querySelector('span:last-child').textContent=text}
  function render(rows){const dates=Array.from({length:30},(_,i)=>day(i-29));const counts=new Map();for(const row of rows){counts.set(row.target_id,(counts.get(row.target_id)||0)+1)}const daily=dates.map(d=>counts.get(d)||0);const total=rows.length;const today=daily[daily.length-1]||0;const max=Math.max(...daily,1);$('today').textContent=fmt(today);$('total').textContent=fmt(total);$('monthly').textContent=fmt(daily.reduce((a,b)=>a+b,0));$('today-date').textContent=day()+' · 한국시간';$('chart').replaceChildren(...daily.map((n,i)=>{const w=document.createElement('div');w.className='bar-wrap';const b=document.createElement('div');b.className='bar';b.style.height=Math.max(2,Math.round(n/max*170))+'px';b.dataset.tip=dates[i]+' · '+fmt(n)+'명';const s=document.createElement('span');s.className='day';s.textContent=dates[i].slice(5);w.append(b,s);return w}));$('table').replaceChildren(...dates.slice(-10).reverse().map((d,i)=>{const r=document.createElement('div');r.className='row';const a=document.createElement('span');a.textContent=d;const b=document.createElement('span');b.textContent=fmt(daily[daily.length-1-i])+'명';r.append(a,b);return r}))}
  async function load(){refresh.disabled=true;setStatus('Supabase에서 방문 기록을 불러오는 중입니다.');try{const url=supabaseUrl+'/rest/v1/blog_reactions?select=target_id,visitor_id,created_at&target_type=eq.site_visit&order=created_at.asc&limit=5000';const response=await fetch(url,{cache:'no-store',headers:{apikey:anonKey,Authorization:'Bearer '+anonKey,Accept:'application/json'}});if(!response.ok)throw new Error('HTTP_'+response.status);const rows=await response.json();render(rows);try{localStorage.setItem(snapshotKey,JSON.stringify({rows,at:new Date().toISOString()}))}catch{}setStatus('정상 연결 · Supabase · '+new Intl.DateTimeFormat('ko-KR',{dateStyle:'medium',timeStyle:'medium',timeZone:'Asia/Seoul'}).format(new Date()),'ok')}catch(error){let cached=null;try{cached=JSON.parse(localStorage.getItem(snapshotKey)||'null')}catch{}if(cached?.rows){render(cached.rows);setStatus('서버 지연으로 마지막 정상 데이터를 표시합니다.','warn')}else{setStatus('Supabase 방문자 데이터 조회에 실패했습니다.','error')}}finally{refresh.disabled=false}}
  refresh.addEventListener('click',load);load();
})();
</script>
</body>
</html>
