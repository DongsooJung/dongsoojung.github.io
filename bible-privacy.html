  <h1>개역한글 개인정보처리방침</h1>
  <p>주식회사 별의문(이하 회사)은 개역한글 앱에서 이용자의 개인정보를 수집하지 않습니다.</p>
  <h2>기기에만 남는 정보</h2>
  <p>마지막으로 읽던 책과 장, 절, 글자 크기는 이용자 기기의 저장소에 남습니다. 이 정보는 회사 서버로 전송되지 않으며, 앱을 지우면 함께 사라집니다.</p>
  <h2>계정, 광고, 결제</h2>
  <p>계정을 만들지 않습니다. 광고를 넣지 않습니다. 앱 안에서 결제를 받지 않습니다. 위치, 연락처, 사진을 요구하지 않습니다.</p>
