<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>방문자 게시판 · STARGATE EDU</title><meta name="description" content="스타게이트 에듀의 교육·프로젝트 질문과 제안을 나누는 방문자 게시판"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/board/board.css"><script type="module" src="/board/board.js"></script></head>
<body><header><a class="brand" href="/">✦ STARGATE EDU</a><nav aria-label="주 메뉴"><a href="/">홈</a><a href="/board/" aria-current="page">게시판</a></nav><button id="login" disabled>Google 로그인</button><button id="logout" hidden>로그아웃</button></header>
<main><section class="hero"><span class="eyebrow">STARGATE COMMUNITY</span><h1>질문에서 시작하는<br>새로운 가능성.</h1><p>교육에 대한 궁금증부터 프로젝트 아이디어까지.<br>스타게이트와 이야기를 나눠 주세요.</p><div class="pills"><span>교육 질문</span><span>프로젝트 문의</span><span>아이디어 제안</span></div></section>
<section class="board"><div class="section-heading"><div><span class="eyebrow">OPEN BOARD</span><h2>방문자 게시판</h2></div><button id="write" disabled>＋ 글쓰기</button></div><p class="notice">모든 게시글은 공개됩니다. 연락처·학생 개인정보 등 민감한 정보는 작성하지 마세요.</p><p id="status" role="status" aria-live="polite">게시판을 불러오고 있습니다.</p><div id="posts"></div><button id="more" hidden>다음 글 보기</button></section>
<footer>STARGATE EDU · 함께 배우고, 함께 만듭니다. <a href="/privacy.html">개인정보처리방침</a><a href="/admin/board/">관리자</a></footer></main>
<dialog id="editor"><form id="post-form"><div class="section-heading"><h2 id="editor-title">글쓰기</h2><button type="button" data-close="editor" class="quiet">닫기</button></div><label>분류<select name="category"><option>일반</option><option>교육 질문</option><option>프로젝트 문의</option><option>제안</option></select></label><label>닉네임<input name="authorName" minlength="2" maxlength="30" required autocomplete="nickname"></label><label>제목<input name="title" minlength="2" maxlength="100" required></label><label>내용<textarea name="body" minlength="5" maxlength="5000" rows="8" required></textarea></label><p class="notice">공개 게시판입니다. 개인정보는 입력하지 마세요.</p><div id="challenge"></div><p id="form-status" role="status"></p><button id="submit" type="submit">게시글 등록</button></form></dialog>
<dialog id="detail"><div class="section-heading"><span id="detail-category" class="badge"></span><button type="button" data-close="detail" class="quiet">닫기</button></div><h2 id="detail-title"></h2><p id="detail-meta" class="muted"></p><p id="detail-body" class="body-text"></p><section id="reply-box" hidden><h3>스타게이트 답변</h3><p id="detail-reply" class="body-text"></p></section><div class="actions"><button id="edit" hidden>수정</button><button id="delete" hidden class="danger">삭제</button></div><form id="reply-form" hidden><label>관리자 답변<textarea name="reply" maxlength="5000" rows="5"></textarea></label><button type="submit">답변 저장</button></form><p id="detail-status" role="status"></p></dialog></body></html>
