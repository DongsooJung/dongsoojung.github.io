<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="STARGATE의 실행·학습·리더십 격언을 전광판처럼 순환해 보여주는 대시보드">
<title>격언 대시보드 | STARGATE</title>
<link rel="canonical" href="https://stargateedu.co.kr/strategy/maxim-board/">
<style>
:root{--bg:#030711;--panel:#0a1220;--line:#1c2d44;--text:#f5f8fc;--muted:#8fa1b8;--cyan:#68e1fd;--gold:#ffd166;--green:#64f0ba}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:radial-gradient(circle at 50% 20%,#122944 0,transparent 44%),linear-gradient(145deg,#02050b,#07111f 58%,#02050b);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:linear-gradient(rgba(104,225,253,.13) 1px,transparent 1px);background-size:100% 5px}
a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}.top{height:72px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px;border-bottom:1px solid rgba(255,255,255,.07)}.brand{font-weight:900;letter-spacing:.14em;color:var(--text)}.brand b{color:var(--cyan)}
.board{min-height:calc(100vh - 150px);display:grid;align-content:center;padding:42px 0 30px}.eyebrow{display:flex;align-items:center;gap:10px;color:var(--cyan);font-size:12px;font-weight:900;letter-spacing:.16em}.pulse{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 18px var(--cyan);animation:pulse 1.8s infinite}
.quote-stage{position:relative;display:grid;place-items:center;min-height:430px;padding:48px 6%;margin:22px 0;border:1px solid var(--line);border-radius:28px;background:linear-gradient(135deg,rgba(10,18,32,.95),rgba(5,12,23,.8));box-shadow:0 30px 90px rgba(0,0,0,.35);overflow:hidden}.quote-stage:after{content:"“";position:absolute;right:4%;bottom:-90px;font:700 290px/1 Georgia,serif;color:rgba(104,225,253,.06)}
.quote{text-align:center;max-width:1000px;position:relative;z-index:1}.quote p{font-size:clamp(31px,5.4vw,70px);line-height:1.32;letter-spacing:-.045em;font-weight:850;margin:0;text-wrap:balance}.quote .original{margin:18px auto 0;max-width:760px;font-size:clamp(14px,1.8vw,19px);line-height:1.5;font-weight:400;letter-spacing:0;color:var(--muted)}.quote .original[hidden]{display:none}.quote .author{margin-top:34px;color:var(--gold);font-size:clamp(16px,2vw,21px);font-weight:800}.quote .context{margin-top:8px;color:var(--muted);font-size:13px}.quote .source{display:inline-block;margin-top:13px;color:var(--cyan);text-decoration:underline;text-underline-offset:4px;font-size:13px;font-weight:700}.quote .source:hover,.quote .source:focus-visible{color:#fff}.quote .source[hidden]{display:none}
.controls{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}.buttons,.tools{display:flex;gap:8px}.btn{min-width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:#0a1728;color:var(--text);font:inherit;font-weight:800;cursor:pointer}.btn:hover,.btn:focus-visible{border-color:var(--cyan);outline:none}.btn.primary{background:var(--cyan);color:#021018;border-color:var(--cyan)}.progress{height:5px;background:#13243a;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:99px}
.meta{display:flex;justify-content:space-between;gap:16px;margin-top:15px;color:var(--muted);font-size:13px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}.filter{border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);padding:8px 13px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}.filter.active{color:#021018;background:var(--green);border-color:var(--green)}
footer{padding:18px 0 30px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.hint{color:#6f829a}
@keyframes pulse{50%{opacity:.35;transform:scale(.82)}}@keyframes enter{from{opacity:0;transform:translateY(16px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}.enter{animation:enter .5s ease both}
:fullscreen .top,:fullscreen footer{display:none}:fullscreen .board{min-height:100vh;padding:28px 0}:fullscreen .wrap{width:min(1400px,calc(100% - 48px))}
@media(max-width:720px){.top span{display:none}.board{padding-top:24px}.quote-stage{min-height:390px;padding:36px 24px}.controls{grid-template-columns:1fr}.buttons,.tools{justify-content:center}.progress{grid-row:1}.meta{flex-direction:column;gap:5px}.filters{justify-content:center}footer{display:block}.hint{margin-top:5px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}

/* Bilingual Peter Thiel quotation display */
.quote-bilingual{width:100%;min-width:0}
.quote-locale{min-width:0}
.quote-locale[hidden]{display:none}
.locale-label{display:none;color:var(--cyan);font-size:12px;font-weight:850;letter-spacing:.1em;margin:0 0 13px}
.quote-bilingual.has-original{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(18px,4vw,56px);align-items:center;text-align:left}
.quote-bilingual.has-original .locale-label{display:block}
.quote-bilingual.has-original #quoteText{font-size:clamp(24px,3.3vw,47px);line-height:1.4;text-align:left;overflow-wrap:anywhere}
.quote-bilingual.has-original .quote-locale.en{border-left:1px solid var(--line);padding-left:clamp(18px,3vw,40px)}
.quote-bilingual.has-original .quote-locale.en .locale-label{color:var(--gold)}
.quote-bilingual.has-original #quoteOriginal{max-width:100%;margin:0;text-align:left;color:#d5e3f3;font-size:clamp(17px,1.9vw,25px);line-height:1.55;font-weight:650;letter-spacing:-.015em;overflow-wrap:anywhere}
@media(max-width:720px){.quote-bilingual.has-original{grid-template-columns:1fr;gap:23px;text-align:center}.quote-bilingual.has-original #quoteText{text-align:center;font-size:clamp(25px,5.6vw,36px)}.quote-bilingual.has-original .quote-locale.en{border-left:0;border-top:1px solid var(--line);padding:20px 0 0}.quote-bilingual.has-original #quoteOriginal{text-align:center;font-size:clamp(17px,4.1vw,21px)}.quote-bilingual.has-original .locale-label{text-align:center}}

</style>
</head>
<body>
<header class="wrap top"><a href="/strategy/">← 전략 대시보드</a><div class="brand">STARGATE <b>MAXIM</b></div><span>Execution · Learning · Leadership</span></header>
<main class="wrap board">
<div class="eyebrow"><i class="pulse"></i> LIVE MAXIM BOARD</div>
<section class="quote-stage" aria-live="polite"><div class="quote" id="quoteBox"><div class="quote-bilingual" id="quoteBilingual"><div class="quote-locale ko"><span class="locale-label">한국어 번역</span><p id="quoteText"></p></div><div class="quote-locale en" id="quoteEnglish" hidden><span class="locale-label" lang="en">ENGLISH ORIGINAL</span><p class="original" id="quoteOriginal" lang="en"></p></div></div><div class="author" id="quoteAuthor"></div><div class="context" id="quoteContext"></div><a class="source" id="quoteSource" href="#" target="_blank" rel="noopener noreferrer" hidden>원문 출처 보기 ↗</a></div></section>
<div class="controls">
<div class="buttons"><button class="btn" id="prev" aria-label="이전 격언">←</button><button class="btn primary" id="play" aria-label="자동 재생 일시정지">Ⅱ</button><button class="btn" id="next" aria-label="다음 격언">→</button></div>
<div class="progress" aria-hidden="true"><i id="bar"></i></div>
<div class="tools"><button class="btn" id="copy" aria-label="격언 복사">복사</button><button class="btn" id="full" aria-label="전체화면">전체</button></div>
</div>
<div class="meta"><span id="counter">01 / 20</span><span id="category">실행</span><span>8초마다 자동 전환</span></div>
<div class="filters" aria-label="격언 카테고리">
<button class="filter active" aria-pressed="true" data-filter="전체">전체</button><button class="filter" aria-pressed="false" data-filter="실행">실행</button><button class="filter" aria-pressed="false" data-filter="학습">학습</button><button class="filter" aria-pressed="false" data-filter="리더십">리더십</button><button class="filter" aria-pressed="false" data-filter="AI">AI</button><button class="filter" type="button" data-filter="독점" aria-pressed="false">독점</button><button class="filter" type="button" data-filter="창업" aria-pressed="false">창업</button><button class="filter" type="button" data-filter="경쟁" aria-pressed="false">경쟁</button><button class="filter" type="button" data-filter="Zero to One" aria-pressed="false">Zero to One</button>
</div>
</main>
<footer class="wrap"><span>© 2026 주식회사 별의문(STARGATE)</span><span class="hint">← → 이동 · Space 재생/정지 · F 전체화면</span></footer>
<script>
const quotes=[
{"text":"연탄재 함부로 발로 차지 마라","author":"안도현","context":"시 「너에게 묻는다」 중 · 타인의 헌신을 돌아보게 하는 시구","category":"리더십","accent":"#ff9e3d","sourceLabel":"안도현 · 「너에게 묻는다」 · 국세청 인용","source":"https://s.nts.go.kr/webtv/na/ntt/selectNttInfo.do?mi=10675&nttSn=1339294"},
{text:"실력보다 안목이다.",author:"STARGATE",context:"무엇을 배울지 판단하는 힘",category:"학습"},
{text:"나는 내가 좋아하는 일을 24시간 하면서 산다.",author:"워런 버핏",context:"일과 삶의 방향",category:"실행"},
{text:"미래를 예측하는 가장 좋은 방법은 미래를 발명하는 것이다.",author:"앨런 케이",context:"창조와 기술",category:"실행"},
{text:"행동에는 위험과 비용이 따른다. 그러나 편안한 무행동보다 훨씬 작다.",author:"존 F. 케네디",context:"결정과 책임",category:"실행"},
{text:"완벽함은 더할 것이 없을 때가 아니라 뺄 것이 없을 때 완성된다.",author:"앙투안 드 생텍쥐페리",context:"단순함과 설계",category:"실행"},
{text:"배움은 결코 마음을 지치게 하지 않는다.",author:"레오나르도 다빈치",context:"지속적인 탐구",category:"학습"},
{text:"중요한 것은 질문을 멈추지 않는 것이다.",author:"알베르트 아인슈타인",context:"호기심과 연구",category:"학습"},
{text:"우리는 아는 것을 말할 수 있는 것보다 더 많이 안다.",author:"마이클 폴라니",context:"암묵지와 경험",category:"학습"},
{text:"우연은 준비된 마음을 편든다.",author:"루이 파스퇴르",context:"관찰과 발견",category:"학습"},
{text:"경영이란 일을 올바르게 하는 것이고, 리더십이란 올바른 일을 하는 것이다.",author:"피터 드러커",context:"경영과 방향",category:"리더십"},
{text:"혼자서는 할 수 있는 일이 적지만, 함께하면 많은 일을 할 수 있다.",author:"헬렌 켈러",context:"협업과 조직",category:"리더십"},
{text:"리더십과 배움은 서로에게 없어서는 안 된다.",author:"존 F. 케네디",context:"성장하는 리더",category:"리더십"},
{text:"본보기가 되는 것은 다른 사람에게 영향을 주는 주된 방법이 아니라 유일한 방법이다.",author:"알베르트 슈바이처",context:"행동으로 이끄는 리더십",category:"리더십"},
{text:"암호화폐는 분산시키지만 AI는 중앙집중화한다.",original:"Crypto's decentralizing, AI is centralizing.",author:"피터 틸 · 번역",context:"2018 · 리드 호프먼과의 대담 · 기술과 권력 집중",category:"AI",sourceLabel:"2018 대담 원문",source:"https://www.bishoprockcap.com/assets/library/peter-thiel/February%202018%20Cardinal%20Conversations%20-%20Reid%20Hoffman%20and%20Peter%20Thiel%20on%20Technology%20and%20Politics%20%5BNEW%5D%20%28transcript%29"},
{text:"인터넷을 금지했더라면, 지금 AI까지 금지한다면 경제성장은 사실상 없을 것이다.",original:"But I would say if we had outlawed the internet and if we now outlaw AI, there will be virtually no growth.",author:"피터 틸 · 번역",context:"2026 · The Builders 대담 · 혁신과 경제성장",category:"AI",sourceLabel:"2026 인터뷰 발언록",source:"https://www.iheart.com/podcast/1119-the-builders-347224769/episode/peter-thiel-we-need-to-hit-348165179/"},
{"text":"다른 누구도 제공하지 않는 것을 세상에 제공해야 한다.","original":"You want to be offering something to the world that no one else is offering","author":"피터 틸 · 번역","context":"2014 · Authors@Wharton · 새로운 가치를 만드는 독점","category":"독점","sourceLabel":"Wharton 공식 대담 · 2014-10-03","source":"https://knowledge.wharton.upenn.edu/article/peter-thiels-notes-on-startups/","accent":"#ffd166"},
{"text":"아주 작은 시장에서 시작해 그 시장 전체를 장악하라.","original":"You start with a really small market and you take over that whole market.","author":"피터 틸 · 번역","context":"2014 · Stanford CS183B · 작은 시장에서 시작해 점차 확장","category":"창업","sourceLabel":"Y Combinator 공식 강연 · 13:13부터","source":"https://www.youtube.com/watch?v=3Fx5Q8xGU8k&t=793s","accent":"#64f0ba"},
{"text":"경쟁은 패자들의 것이다.","original":"Competition Is for Losers","author":"피터 틸 · 번역","context":"2014 · Authors@Wharton · 본인이 인용한 발췌 기사 제목 · 경쟁보다 고유한 가치","category":"경쟁","sourceLabel":"Wharton 공식 대담 · 2014-10-03","source":"https://knowledge.wharton.upenn.edu/article/peter-thiels-notes-on-startups/","accent":"#66d8ff"},
{"text":"새로운 일을 할 때, 당신은 0에서 1로 나아간다.","original":"But when you do something new, you go from 0 to 1.","author":"피터 틸 · 블레이크 매스터스 · 번역","context":"2014 · Zero to One · 복제를 넘어 새로운 가치 창조","category":"Zero to One","sourceLabel":"Zero to One · 출판사 공식 소개","source":"https://www.penguinrandomhouse.com/books/234730/zero-to-one-by-peter-thiel-with-blake-masters/9780804139304/","accent":"#a99aff"}
];
let filter="전체",visible=[...quotes],index=0,playing=true,timer,startAt;
const DURATION=8000,q=id=>document.getElementById(id);
function refreshList(){visible=filter==="전체"?[...quotes]:quotes.filter(x=>x.category===filter);index=0;render()}
function render(){const item=visible[index];const box=q("quoteBox");box.classList.remove("enter");void box.offsetWidth;box.classList.add("enter");q("quoteText").textContent=item.text;q("quoteEnglish").hidden=!item.original;q("quoteBilingual").classList.toggle("has-original",Boolean(item.original));q("quoteOriginal").textContent=item.original||"";q("quoteAuthor").textContent="— "+item.author;q("quoteContext").textContent=item.context;const source=q("quoteSource");source.hidden=!item.source;if(item.source){source.href=item.source;source.textContent="출처 · "+item.sourceLabel+" ↗"}q("category").textContent=item.category;q("counter").textContent=String(index+1).padStart(2,"0")+" / "+String(visible.length).padStart(2,"0");restart()}
function move(delta){index=(index+delta+visible.length)%visible.length;render()}
function restart(){clearInterval(timer);startAt=Date.now();q("bar").style.width="0%";if(playing)timer=setInterval(()=>{const p=(Date.now()-startAt)/DURATION*100;q("bar").style.width=Math.min(p,100)+"%";if(p>=100)move(1)},80)}
function toggle(){playing=!playing;q("play").textContent=playing?"Ⅱ":"▶";restart()}
q("prev").onclick=()=>move(-1);q("next").onclick=()=>move(1);q("play").onclick=toggle;
q("copy").onclick=async()=>{const item=visible[index];try{await navigator.clipboard.writeText("“"+item.text+"” — "+item.author+(item.original?"\n원문: "+item.original:"")+(item.source?"\n출처: "+item.source:""));q("copy").textContent="완료";setTimeout(()=>q("copy").textContent="복사",1200)}catch(e){q("copy").textContent="실패"}};
q("full").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
document.querySelectorAll(".filter").forEach(btn=>btn.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));btn.classList.add("active");document.querySelectorAll(".filter").forEach(x=>x.setAttribute("aria-pressed",String(x===btn)));filter=btn.dataset.filter;refreshList()});
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1);if(e.code==="Space"){e.preventDefault();toggle()}if(e.key.toLowerCase()==="f")q("full").click()});
render();
</script>
</body>
</html>
