<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>비공개 자료 | STARGATE</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: #f4f7fc; color: #172033; font: 16px/1.6 system-ui, sans-serif; }
    main { width: min(100%, 28rem); padding: 2rem; border: 1px solid #dce3ee; border-radius: 14px; background: #fff; box-shadow: 0 12px 35px #1a315216; }
    h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
    p { margin: .5rem 0 1.5rem; }
    label, input, button { display: block; width: 100%; }
    input { margin: .4rem 0 1rem; padding: .75rem; border: 1px solid #9caec9; border-radius: 6px; font: inherit; }
    button { padding: .8rem; border: 0; border-radius: 6px; background: #153b70; color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    [role="alert"] { min-height: 1.5em; color: #a21818; margin: .8rem 0 0; }
    a { color: #153b70; }
  </style>
</head>
<body>
  <main>
    <h1>비공개 자료</h1>
    <p>본인 확인 후 열람할 수 있습니다.</p>
    <form id="login">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" minlength="32" maxlength="1024" required>
      <button id="submit" type="submit">열람</button>
      <p id="message" role="alert" aria-live="polite"></p>
    </form>
    <a href="/">홈으로</a>
  </main>
  <script>
    const gateway = 'https://stargate-private-gateway.vercel.app/api/private-monetization';
    const form = document.getElementById('login');
    const passwordField = document.getElementById('password');
    const button = document.getElementById('submit');
    const message = document.getElementById('message');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = passwordField.value;
      passwordField.value = '';
      message.textContent = '';
      button.disabled = true;
      try {
        const response = await fetch(gateway, {
          method: 'POST',
          mode: 'cors',
          credentials: 'omit',
          cache: 'no-store',
          redirect: 'error',
          referrerPolicy: 'no-referrer',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ password })
        });
        if (!response.ok) {
          message.textContent = response.status === 401 ? '비밀번호를 확인해 주세요.' : '자료를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';
          return;
        }
        if (!response.headers.get('Content-Type')?.toLowerCase().startsWith('text/html')) throw new Error('Unexpected response');
        const html = await response.text();
        document.open();
        document.write(html);
        document.close();
      } catch {
        message.textContent = '인증 서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
