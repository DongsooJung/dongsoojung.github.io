<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수도권 학원 밀집도 통합 지도 (서울·경기)</title>
<style>
 :root{ --bg:#faf9f5; --surface:#fff; --border:rgba(0,0,0,0.12); --text:#1f1e1c; --muted:#6b6a64; }
 @media (prefers-color-scheme: dark){ :root{ --bg:#1c1b19; --surface:#262522; --border:rgba(255,255,255,0.14); --text:#f3f1ea; --muted:#a9a89f; } }
 *{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;}
 .wrap{max-width:960px;margin:0 auto;padding:32px 24px 56px;}
 h1{font-size:22px;font-weight:600;margin:0 0 4px;} .sub{color:var(--muted);font-size:14px;margin:0 0 8px;}
 .note{font-size:12px;color:var(--muted);background:var(--surface);border:0.5px solid var(--border);border-radius:8px;padding:8px 12px;margin:0 0 18px;display:inline-block;}
 .legend{display:flex;gap:10px;font-size:12px;color:var(--muted);margin-bottom:10px;}
 .legend span{display:flex;align-items:center;gap:4px;} .sw{width:12px;height:12px;border-radius:3px;display:inline-block;}
 .cols{display:grid;grid-template-columns:1.4fr 0.6fr;gap:18px;align-items:start;}
 .panel{background:var(--surface);border:0.5px solid var(--border);border-radius:14px;padding:16px;}
 #readout{margin-top:12px;font-size:13px;color:var(--muted);min-height:20px;}
 .foot{font-size:12px;color:var(--muted);margin-top:16px;text-align:right;}
 @media(max-width:680px){.cols{grid-template-columns:1fr;}}
</style>  <link rel="stylesheet" href="/assets/site-theme.css">
  <script src="/assets/site-theme.js"></script>
</head><body><div class="wrap">
 <h1>수도권 학원 밀집도 통합 지도</h1>
 <p class="sub">서울 25자치구 + 경기 31시군 실데이터 · 총 59,492개 학원</p>
 <p class="note">인천 10개 군·구는 데이터 확보 후 추가됩니다(인천 학원 데이터는 교육지원청별 분산 제공).</p>
 <div class="legend"><span><i class="sw" style="background:#042C53"></i>많음</span><span><i class="sw" style="background:#378ADD"></i>중간</span><span><i class="sw" style="background:#E6F1FB"></i>적음</span><span style="margin-left:6px;"><i class="sw" style="background:#534AB7"></i>서울</span><span><i class="sw" style="background:#185FA5"></i>경기</span></div>
 <div class="cols">
  <div class="panel"><div id="map" style="width:100%;"></div><div id="readout">지역에 마우스를 올리면 학원 수가 표시됩니다.</div></div>
  <div class="panel"><b style="font-size:14px;font-weight:600;">학원 수 상위</b><div id="rank" style="margin-top:10px;"></div></div>
 </div>
 <p class="foot">Stargate Corporation · 서울 열린데이터 + 경기데이터드림 실데이터</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const seoul={"종로구":291,"중구":161,"용산구":242,"성동구":578,"광진구":731,"동대문구":733,"중랑구":559,"성북구":990,"강북구":380,"도봉구":597,"노원구":1427,"은평구":1076,"서대문구":740,"마포구":1172,"양천구":2115,"강서구":1393,"구로구":791,"금천구":364,"영등포구":863,"동작구":926,"관악구":726,"서초구":1817,"강남구":3421,"송파구":1970,"강동구":1417};
const gg={"수원시":3492,"용인시":3095,"고양시":3017,"성남시":2997,"화성시":2565,"부천시":1874,"남양주시":1728,"안양시":1606,"김포시":1430,"시흥시":1248,"안산시":1225,"평택시":1105,"의정부시":1098,"파주시":983,"광명시":855,"하남시":746,"군포시":743,"광주시":691,"구리시":572,"이천시":552,"오산시":461,"양주시":422,"의왕시":334,"안성시":248,"양평군":198,"여주시":167,"과천시":161,"포천시":153,"동두천시":126,"가평군":80,"연천군":40};
function parent(n){var i=n.lastIndexOf('시');if(i>=0)return n.slice(0,i+1);var j=n.indexOf('군');if(j>=0)return n.slice(0,j+1);return n;}
function val(f){var c=String(f.properties.code||''),n=f.properties.name;if(c.slice(0,2)==='11')return{k:n,v:seoul[n],r:'서울'};if(c.slice(0,2)==='31'){var p=parent(n);return{k:p,v:gg[p],r:'경기'};}return null;}
const isDark=matchMedia('(prefers-color-scheme: dark)').matches;
const scheme=isDark?d3.schemeBlues[7].slice().reverse():d3.schemeBlues[7];
const mx=Math.max(Math.max(...Object.values(seoul)),Math.max(...Object.values(gg)));
const color=d3.scaleQuantize([0,mx],scheme);
const W=820,H=640;
const svg=d3.select('#map').append('svg').attr('viewBox','0 0 '+W+' '+H).attr('width','100%').attr('role','img').attr('aria-label','수도권 학원 밀집도 통합 지도');
const tip=d3.select('#readout');
d3.json('https://cdn.jsdelivr.net/gh/southkorea/southkorea-maps@master/kostat/2013/json/skorea_municipalities_geo_simple.json').then(function(geo){
  const feats=geo.features.filter(function(f){var r=val(f);return r&&r.v!=null;});
  const path=d3.geoPath(d3.geoMercator().fitSize([W,H-10],{type:'FeatureCollection',features:feats}));
  svg.selectAll('path').data(feats).join('path').attr('d',path)
    .attr('fill',function(d){return color(val(d).v||0);})
    .attr('stroke',isDark?'rgba(255,255,255,0.22)':'#fff').attr('stroke-width',0.5).style('cursor','pointer')
    .on('mousemove',function(e,d){var r=val(d);tip.html('<b>'+r.k+'</b> <span style="color:var(--muted)">('+r.r+')</span> · 학원 '+r.v.toLocaleString()+'개');d3.select(this).attr('stroke-width',1.3).attr('stroke',isDark?'#fff':'#333');})
    .on('mouseout',function(){d3.select(this).attr('stroke-width',0.5).attr('stroke',isDark?'rgba(255,255,255,0.22)':'#fff');});
  var all=Object.assign({},seoul,gg);
  var topset={};Object.entries(all).sort((a,b)=>b[1]-a[1]).slice(0,16).forEach(function(t){topset[t[0]]=1;});
  var seen={};
  svg.selectAll('text').data(feats.filter(function(f){var k=val(f).k;if(seen[k]||!topset[k])return false;seen[k]=1;return true;})).join('text')
    .attr('transform',function(d){return 'translate('+path.centroid(d)+')';}).attr('text-anchor','middle').attr('dy','0.32em')
    .attr('font-size',9).attr('pointer-events','none').attr('fill',isDark?'#dceaf9':'#042C53')
    .text(function(d){return val(d).k.replace(/(시|구|군)$/,'');});
  var top=Object.entries(all).sort((a,b)=>b[1]-a[1]).slice(0,16);
  document.getElementById('rank').innerHTML=top.map(function(t,n){var w=Math.round(t[1]/top[0][1]*100);var reg=seoul[t[0]]!=null?'서울':'경기';
    return '<div style="margin-bottom:6px;"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px;"><span><span style="color:var(--muted)">'+(n+1)+'.</span> '+t[0]+' <span style="color:var(--muted);font-size:10px">'+reg+'</span></span><span style="font-weight:500">'+t[1].toLocaleString()+'</span></div><div style="height:5px;background:var(--bg);border-radius:3px;"><div style="height:5px;width:'+w+'%;background:'+(reg==='서울'?'#534AB7':'#185FA5')+';border-radius:3px;"></div></div></div>';}).join('');
});
</script></body></html>
